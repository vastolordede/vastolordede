name: Update LOC

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile README repo
        uses: actions/checkout@v4

      - name: Install cloc and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc jq

      - name: Get all public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir repos

          gh repo list vastolordede \
            --limit 100 \
            --json name,isFork,isPrivate \
            --jq '.[] | select(.isPrivate == false and .isFork == false and .name != "vastolordede") | .name' > repos.txt

          echo "Repositories to count:"
          cat repos.txt

      - name: Clone repositories
        run: |
          while read repo; do
            echo "Cloning $repo ..."
            git clone --depth 1 https://github.com/vastolordede/$repo.git repos/$repo || true
          done < repos.txt

           - name: Count lines of code
        run: |
          echo "repo,lines" > loc.csv

          for dir in repos/*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")

              lines=$(cloc "$dir" \
                --json \
                --exclude-dir=.git,node_modules,build,dist,.dart_tool,coverage,vendor,.gradle,target,bin,obj \
                | jq '.SUM.code // 0')

              echo "$name,$lines" >> loc.csv
            fi
          done

          total=$(tail -n +2 loc.csv | awk -F, '{sum += $2} END {print sum + 0}')

          echo "## 📊 Total Lines of Code" > loc.md
          echo "" >> loc.md
          echo "**Total code lines:** $total" >> loc.md
          echo "" >> loc.md

          echo "### 🔥 Top 10 repositories by code lines" >> loc.md
          echo "" >> loc.md
          echo "| Rank | Project | Code Lines |" >> loc.md
          echo "|---:|---|---:|" >> loc.md

          tail -n +2 loc.csv | sort -t, -k2,2nr | head -n 10 | awk -F, '{print "| " NR " | " $1 " | " $2 " |"}' >> loc.md

          echo "" >> loc.md
          echo "<details>" >> loc.md
          echo "<summary>Show all repositories</summary>" >> loc.md
          echo "" >> loc.md
          echo "| Rank | Project | Code Lines |" >> loc.md
          echo "|---:|---|---:|" >> loc.md

          tail -n +2 loc.csv | sort -t, -k2,2nr | awk -F, '{print "| " NR " | " $1 " | " $2 " |"}' >> loc.md

          echo "" >> loc.md
          echo "</details>" >> loc.md

      - name: Update README
        run: |
          python3 << 'EOF'
          from pathlib import Path

          readme = Path("README.md")
          loc = Path("loc.md").read_text(encoding="utf-8")

          content = readme.read_text(encoding="utf-8")

          start = "<!-- LOC-START -->"
          end = "<!-- LOC-END -->"

          block = f"{start}\n{loc}\n{end}"

          if start in content and end in content:
              before = content.split(start)[0]
              after = content.split(end)[1]
              content = before + block + after
          else:
              content += "\n\n" + block + "\n"

          readme.write_text(content, encoding="utf-8")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update total lines of code" || echo "No changes to commit"
          git push
